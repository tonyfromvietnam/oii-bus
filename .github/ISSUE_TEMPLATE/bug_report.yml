name: 🐞 Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not** report security issues here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to the temple floor
        2. Tap "Xin quẻ se duyên"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: floor
    attributes:
      label: Where in the app?
      options:
        - 🚌 Top deck / same city
        - 📚 Library
        - 🏮 Temple / matching
        - HUD / menus
        - Other
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 14, Safari 18 / Windows, Chrome 131
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
      description: Drag images in here. Remove any personal information first.
