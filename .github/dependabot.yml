version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          [
            "eslint*",
            "@eslint/*",
            "typescript-eslint",
            "prettier",
            "vitest",
            "@playwright/*",
            "turbo",
            "typescript",
          ]
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
    ignore:
      # Major upgrades are done deliberately, not by bot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
